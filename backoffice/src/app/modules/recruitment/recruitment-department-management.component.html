<app-backoffice-page eyebrow="PEOPLE / RECRUITMENT" title="Recruitment departments" description="Manage departments available when creating recruitment jobs." [loading]="loading" [error]="error" (retry)="load()">
  <div page-actions><button class="btn btn-primary" type="button" (click)="openCreate()"><i class="bi bi-plus-lg me-1"></i>New department</button></div>
  @if (editorOpen) { <section class="editor"><div class="editor-heading"><h2>{{ editingId ? 'Edit department' : 'New department' }}</h2><button class="btn-close" type="button" (click)="editorOpen = false"></button></div><label>Name<input class="form-control" [(ngModel)]="name"></label><button class="btn btn-primary" [disabled]="saving || !name.trim()" (click)="save()">{{ saving ? 'Saving...' : 'Save department' }}</button></section> }
  <div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Name</th><th>Slug</th><th>Jobs</th><th>Status</th><th></th></tr></thead><tbody>@for (item of items; track item.id) {<tr><td><strong>{{ item.name }}</strong></td><td>{{ item.slug }}</td><td>{{ item.usage_count }}</td><td><span class="status" [class.active]="item.status === 1">{{ item.status === 1 ? 'Active' : 'Inactive' }}</span></td><td class="text-end text-nowrap"><button class="icon-button" title="Edit" (click)="edit(item)"><i class="bi bi-pencil"></i></button><button class="icon-button danger" title="Delete" (click)="remove(item)"><i class="bi bi-trash"></i></button></td></tr>} @empty {<tr><td colspan="5" class="empty-state">No departments found.</td></tr>}</tbody></table></div>
</app-backoffice-page>
