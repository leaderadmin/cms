<app-backoffice-page eyebrow="CONTENT / TAGS" title="Tag management" description="Create and maintain the managed tags used by articles." [loading]="loading" [error]="error" (retry)="load()">
  <div page-actions><button class="btn btn-primary" type="button" (click)="editingId = 0; name = ''; slug = ''"><i class="bi bi-plus-lg me-1"></i>New tag</button></div>
  <div class="tag-toolbar"><input class="form-control" type="search" placeholder="Search tags" [(ngModel)]="query" (keyup.enter)="load()"><button class="btn btn-outline-secondary" type="button" (click)="load()"><i class="bi bi-search"></i><span class="visually-hidden">Search</span></button></div>
  @if (editingId !== null) {
    <section class="tag-editor"><div class="editor-heading"><div><span class="eyebrow">{{ editingId ? 'EDIT TAG' : 'NEW TAG' }}</span><h2>{{ editingId ? 'Update tag' : 'Create tag' }}</h2></div><button class="btn-close" type="button" aria-label="Close" (click)="cancel()"></button></div><div class="editor-grid"><label>Name<input class="form-control" [(ngModel)]="name" required></label><label>Slug<input class="form-control" [(ngModel)]="slug" placeholder="Generated from name"></label></div><div class="editor-actions"><button class="btn btn-light me-2" type="button" (click)="cancel()">Cancel</button><button class="btn btn-primary" type="button" [disabled]="saving || !name.trim()" (click)="save()">{{ saving ? 'Saving...' : 'Save tag' }}</button></div></section>
  }
  <div class="tag-table table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Name</th><th>Slug</th><th>Articles</th><th class="text-end">Actions</th></tr></thead><tbody>@for (tag of tags; track tag.id) {<tr><td><strong>{{ tag.name }}</strong></td><td><code>{{ tag.slug }}</code></td><td>{{ tag.usage_count }}</td><td class="text-end"><button class="icon-button" type="button" title="Edit tag" (click)="edit(tag)"><i class="bi bi-pencil"></i><span class="visually-hidden">Edit</span></button><button class="icon-button danger" type="button" title="Delete tag" (click)="remove(tag)"><i class="bi bi-trash"></i><span class="visually-hidden">Delete</span></button></td></tr>} @empty {<tr><td colspan="4" class="empty-state">No tags found.</td></tr>}</tbody></table></div>
</app-backoffice-page>
