<main class="page-editor" ng-controller="PageEditorController as editor">
  <header class="editor-topbar">
    <div><span class="eyebrow">CONTENT / PAGES</span><h1>{{ editor.page.name }}</h1><p>{{ editor.notice }}</p></div>
    <div class="editor-actions"><button ng-click="editor.save()" title="Save draft">Save draft</button><button class="publish" ng-click="editor.publish()" title="Publish page">Publish</button></div>
  </header>
  <div class="editor-layout">
    <aside class="block-library"><span class="eyebrow">BLOCK LIBRARY</span><button ng-repeat="item in editor.library" class="library-item" ng-click="editor.add(item.type, editor.template.regions[2])"><b>{{ item.icon }}</b><span>{{ item.label }}</span></button></aside>
    <section class="canvas" aria-label="Page canvas">
      <article class="canvas-page">
        <section ng-repeat="region in editor.template.regions" class="editor-region" ng-class="{'is-locked': region.locked}" ng-drop="editor.drop(region)" data-region="{{ region.id }}">
          <div class="region-heading"><span>{{ region.label }}</span><small>{{ region.locked ? 'Locked' : (editor.regions[region.id].length + ' blocks') }}</small></div>
          <div ng-if="!editor.regions[region.id].length" class="empty-region">Drop a block here</div>
          <article ng-repeat="block in editor.regions[region.id]" class="canvas-block" ng-class="{'is-selected': editor.selected === block}" draggable="{{ !region.locked }}" ng-dragstart="editor.startDrag(block, region)" ng-drop="editor.drop(region, block)" ng-click="editor.select(block)"><div dynamic-block="block"></div><button ng-if="!region.locked" class="remove-block" ng-click="editor.remove(region, block); $event.stopPropagation()" title="Remove block">Remove</button></article>
        </section>
      </article>
    </section>
    <aside class="properties" ng-if="editor.selected"><span class="eyebrow">PROPERTIES</span><h2>{{ (editor.selected.type) }}</h2><label>Title<input ng-model="editor.selected.props.title"></label><label ng-if="editor.selected.props.subtitle">Subtitle<textarea ng-model="editor.selected.props.subtitle"></textarea></label><label ng-if="editor.selected.props.text">Text<textarea ng-model="editor.selected.props.text"></textarea></label><label ng-if="editor.selected.props.label">Button label<input ng-model="editor.selected.props.label"></label><button ng-if="editor.selected.props.source" class="source-button" ng-click="editor.previewSource(editor.selected)">Preview source</button></aside>
    <aside class="properties empty-properties" ng-if="!editor.selected"><span class="eyebrow">PROPERTIES</span><p>Select a block to edit its content.</p></aside>
  </div>
</main>
