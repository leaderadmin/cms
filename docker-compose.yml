services:
  api:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - media_data:/app/media
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: change-me-in-development
      DB_ENGINE: postgresql
      POSTGRES_DB: startup
      POSTGRES_USER: startup
      POSTGRES_PASSWORD: startup-dev-password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/media
      DATA_UPLOAD_MAX_MEMORY_SIZE: ${DATA_UPLOAD_MAX_MEMORY_SIZE:-104857600}
      FILE_UPLOAD_MAX_MEMORY_SIZE: ${FILE_UPLOAD_MAX_MEMORY_SIZE:-104857600}
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-26214400}
      MEDIA_ALLOWED_EXTENSIONS: ${MEDIA_ALLOWED_EXTENSIONS:-jpg,jpeg,png,gif,webp,pdf,txt,csv,doc,docx,xls,xlsx,ppt,pptx,zip}
      DJANGO_CACHE_URL: redis://redis:6379/1
      API_RATE_LIMIT_ANON: ${API_RATE_LIMIT_ANON:-100/hour}
      API_RATE_LIMIT_USER: ${API_RATE_LIMIT_USER:-1000/hour}
      API_RATE_LIMIT_LOGIN: ${API_RATE_LIMIT_LOGIN:-5/minute}
      API_RATE_LIMIT_REGISTER: ${API_RATE_LIMIT_REGISTER:-10/hour}
      API_RATE_LIMIT_PASSWORD_RESET: ${API_RATE_LIMIT_PASSWORD_RESET:-5/hour}
      API_RATE_LIMIT_PASSWORD_CONFIRM: ${API_RATE_LIMIT_PASSWORD_CONFIRM:-10/hour}
      JWT_ACCESS_TOKEN_LIFETIME_SECONDS: "900"
      JWT_REFRESH_TOKEN_LIFETIME_SECONDS: "604800"
      AUTH_MAX_SESSIONS: "5"
      DJANGO_EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: ${SMTP_HOST}
      EMAIL_PORT: ${SMTP_PORT:-587}
      EMAIL_HOST_USER: ${SMTP_USERNAME}
      EMAIL_HOST_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_USE_TLS: ${SMTP_USE_TLS:-1}
      EMAIL_USE_SSL: ${SMTP_USE_SSL:-0}
      DEFAULT_FROM_EMAIL: ${SMTP_USERNAME}
      BACKOFFICE_URL: http://localhost:4200
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  cron:
    build: ./cron_service
    volumes:
      - ./cron_service:/app
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: startup
      POSTGRES_USER: startup
      POSTGRES_PASSWORD: startup-dev-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U startup -d startup"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api

  backoffice:
    build: ./backoffice
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  redis_data:
  postgres_data:
  media_data:
